name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: # lets you press "Run workflow" manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds the game code. The Android wrapper is generated fresh each build.
      - name: Generate Android project
        run: |
          flutter create --platforms=android --org com.blockbloom --project-name block_bloom /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Brand the app (name, icon, splash, AdMob id)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then unset ADMOB_APP_ID; fi
          python3 tools/patch_android.py

      - run: flutter pub get

      # --no-shrink turns off R8 code stripping. R8 can silently remove classes that the ads /
      # audio plugins need, which makes a release APK close itself right after the logo.
      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --no-shrink 2>&1 | tee build.log

      - name: Show the real error (runs only if the build failed)
        if: failure()
        run: |
          echo "=========== THE REAL ERROR ==========="
          grep -n -B3 -A30 "What went wrong" build.log | head -n 120 || tail -n 100 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # The run number is in the name so you can be sure you installed the NEWEST build.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBloom-apk-run${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

  # Opens the freshly built APK on a real Android emulator and records what happens.
  # If the game closes by itself, the exact crash reason is printed in this job's log
  # ("RESULT" block) and saved as the "smoke-test-log" download.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Enable hardware acceleration (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v4
        with:
          name: BlockBloom-apk-run${{ github.run_number }}
          path: apk

      - name: Launch the game on an Android ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/smoke_test.sh apk/app-release.apk smoke-out

      - name: Upload smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log-android${{ matrix.api-level }}
          path: smoke-out
